<!DOCTYPE html>
<html>
<head>
    <title>LogStreamX</title>

    <link rel="icon" href="/favicon.ico">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0b1220;
            color: white;
            display: flex;
        }

        .sidebar {
            width: 220px;
            background: #111827;
            height: 100vh;
            padding: 20px;
        }

        .menu div {
            padding: 10px;
            cursor: pointer;
            margin-bottom: 5px;
            color: #aaa;
        }

            .menu div:hover {
                background: #1f2937;
                color: white;
            }

        .main {
            flex: 1;
            padding: 20px;
        }

        .card {
            background: #111827;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .log {
            background: #0f172a;
            padding: 10px;
            margin-bottom: 8px;
            border-left: 3px solid #38bdf8;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
        }

        button {
            background: #38bdf8;
            border: none;
            padding: 8px 12px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h3>LogStreamX</h3>

        <div class="menu">
            <div onclick="show('dashboard')">📊 Dashboard</div>
            <div onclick="show('logs')">📁 Logs</div>
            <div onclick="show('kafka')">⚡ Kafka</div>
            <div onclick="show('settings')">⚙ Settings</div>
        </div>
    </div>

    <div class="main">

        <button onclick="loadLogs()">Refresh</button>

        <!-- DASHBOARD -->
        <div id="dashboard">

            <div class="card">
                <h3>Stats</h3>

                <div class="stat">
                    <span>Total Logs</span>
                    <b id="total">0</b>
                </div>

                <div class="stat">
                    <span>Kafka</span>
                    <b>Active</b>
                </div>

                <div class="stat">
                    <span>Worker</span>
                    <b>Running</b>
                </div>
            </div>

            <div class="card">
                <h3>Log Trend</h3>
                <canvas id="chart"></canvas>
            </div>

        </div>

        <!-- LOGS -->
        <div id="logs" style="display:none">
            <div class="card">
                <h3>Logs</h3>
                <div id="logList"></div>
            </div>
        </div>

        <!-- KAFKA -->
        <div id="kafka" style="display:none">
            <div class="card">
                <h3>Kafka Status</h3>
                <p>Confluent Cloud → ACTIVE</p>
            </div>
        </div>

        <!-- SETTINGS -->
        <div id="settings" style="display:none">
            <div class="card">
                <h3>Settings</h3>
                <p>Configuration Panel Coming Soon ⚙</p>
            </div>
        </div>

    </div>

    <script>

        const API = window.location.origin;
        let chart;

        function show(tab) {
            document.getElementById("dashboard").style.display = tab === "dashboard" ? "block" : "none";
            document.getElementById("logs").style.display = tab === "logs" ? "block" : "none";
            document.getElementById("kafka").style.display = tab === "kafka" ? "block" : "none";
            document.getElementById("settings").style.display = tab === "settings" ? "block" : "none";
        }

        async function loadLogs() {

            try {
                const res = await fetch(API + "/api/logs");
                const data = await res.json();

                if (!Array.isArray(data)) {
                    document.getElementById("logList").innerHTML = "API Error";
                    return;
                }

                document.getElementById("total").innerText = data.length;

                document.getElementById("logList").innerHTML =
                    data.map(x => `
                    <div class="log">
                        <b>${x.message}</b><br>
                        <small>${x.eventId} | ${x.source} | ${x.createdAt}</small>
                    </div>
                `).join("");

                drawChart(data);

            } catch (e) {
                console.log(e);
            }
        }

        function drawChart(data) {

            const ctx = document.getElementById("chart");

            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: "line",
                data: {
                    labels: data.map((_, i) => i),
                    datasets: [{
                        label: "Logs",
                        data: data.map((_, i) => i + 1),
                        borderColor: "#38bdf8"
                    }]
                }
            });
        }

        loadLogs();
        setInterval(loadLogs, 5000);

    </script>

</body>
</html>
