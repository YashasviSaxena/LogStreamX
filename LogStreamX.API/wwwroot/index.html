<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LogStreamX</title>

    <link rel="icon" href="/favicon.ico">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter;
        }

        body {
            background: #0b1220;
            color: #e5e7eb;
            display: flex;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            height: 100vh;
            background: #0f172a;
            padding: 20px;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 25px;
        }

        .nav div {
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 10px;
            cursor: pointer;
            color: #94a3b8;
        }

            .nav div:hover,
            .nav .active {
                background: #1e293b;
                color: white;
            }

        /* MAIN */
        .main {
            flex: 1;
            padding: 20px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
        }

        .btn {
            background: #38bdf8;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            color: white;
        }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
        }

        /* CARD */
        .card {
            background: #111827;
            padding: 15px;
            border-radius: 14px;
        }

        /* LOGS */
        .logs {
            max-height: 420px;
            overflow-y: auto;
        }

        .log {
            padding: 12px;
            margin-bottom: 10px;
            background: #0f172a;
            border-left: 3px solid #38bdf8;
            border-radius: 10px;
        }

        .meta {
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
        }

        /* STATS */
        .stat {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #0f172a;
            margin-bottom: 10px;
            border-radius: 10px;
        }

        .badge {
            padding: 4px 10px;
            background: #1e293b;
            border-radius: 8px;
            color: #38bdf8;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo">LogStreamX</div>

        <div class="nav">
            <div class="active">📊 Dashboard</div>
            <div>📁 Logs</div>
            <div>⚡ Kafka</div>
            <div>⚙ Settings</div>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main">

        <div class="topbar">
            <div class="title">Live Log Dashboard</div>
            <button class="btn" onclick="loadData()">Refresh</button>
        </div>

        <div class="grid">

            <!-- LEFT -->
            <div class="card">
                <h3>Live Logs</h3>
                <div class="logs" id="logs"></div>
            </div>

            <!-- RIGHT -->
            <div>

                <div class="card">
                    <h3>Stats</h3>

                    <div class="stat">
                        <span>Total Logs</span>
                        <b id="total">0</b>
                    </div>

                    <div class="stat">
                        <span>Kafka</span>
                        <span class="badge">Active</span>
                    </div>

                    <div class="stat">
                        <span>Worker</span>
                        <span class="badge">Running</span>
                    </div>
                </div>

                <div class="card">
                    <h3>Log Trend</h3>
                    <canvas id="chart"></canvas>
                </div>

            </div>
        </div>
    </div>

    <script>

        let chart;

        async function loadData() {

            try {

                const res = await fetch('/api/logs');
                const data = await res.json();

                if (!Array.isArray(data)) return;

                document.getElementById("total").innerText = data.length;

                document.getElementById("logs").innerHTML =
                    data.map(x => `
                    <div class="log">
                        <div>${x.message}</div>
                        <div class="meta">
                            <span>${x.eventId}</span>
                            <span>${new Date(x.createdAt).toLocaleString()}</span>
                        </div>
                    </div>
                `).join("") || "<div>No logs</div>";

                drawChart(
                    data.map(x => new Date(x.createdAt).toLocaleTimeString()),
                    data.map((_, i) => i + 1)
                );

            } catch (e) {
                console.log("UI error", e);
            }
        }

        function drawChart(labels, values) {

            const ctx = document.getElementById("chart");

            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: "line",
                data: {
                    labels: labels.length ? labels : ["No Data"],
                    datasets: [{
                        data: values.length ? values : [0],
                        borderColor: "#38bdf8",
                        tension: 0.4
                    }]
                },
                options: {
                    plugins: { legend: { display: false } },
                    scales: { x: { display: false } }
                }
            });
        }

        loadData();
        setInterval(loadData, 5000);

    </script>

</body>
</html>
