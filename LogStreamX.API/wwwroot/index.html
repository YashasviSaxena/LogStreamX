<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LogStreamX Dashboard</title>

    <link rel="icon" href="/favicon.ico">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Inter;
            background: #0b1220;
            color: #e5e7eb;
            display: flex;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            height: 100vh;
            background: #0f172a;
            padding: 20px;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 20px;
        }

        .nav div {
            padding: 12px;
            margin: 6px 0;
            cursor: pointer;
            border-radius: 8px;
            color: #94a3b8;
        }

            .nav div:hover, .active {
                background: #1e293b;
                color: white;
            }

        /* MAIN */
        .main {
            flex: 1;
            padding: 20px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            background: #38bdf8;
            color: white;
            cursor: pointer;
        }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
        }

        .card {
            background: #111827;
            padding: 15px;
            border-radius: 12px;
        }

        /* LOGS */
        .log {
            background: #0f172a;
            padding: 10px;
            margin: 8px 0;
            border-left: 3px solid #38bdf8;
            border-radius: 8px;
        }

        /* STATS */
        .stat {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #0f172a;
            margin: 8px 0;
            border-radius: 8px;
        }

        .badge {
            background: #1e293b;
            padding: 4px 10px;
            border-radius: 6px;
            color: #38bdf8;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <div class="logo">LogStreamX</div>

        <div class="nav">
            <div class="active" onclick="switchTab('dashboard')">📊 Dashboard</div>
            <div onclick="switchTab('logs')">📁 Logs</div>
            <div onclick="switchTab('kafka')">⚡ Kafka</div>
            <div onclick="switchTab('settings')">⚙ Settings</div>
        </div>
    </div>

    <div class="main">

        <div class="topbar">
            <h2 id="title">Dashboard</h2>
            <button class="btn" onclick="loadLogs()">Refresh</button>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard">

            <div class="grid">

                <div class="card">
                    <h3>Log Trend</h3>
                    <canvas id="chart"></canvas>
                </div>

                <div class="card">
                    <h3>Stats</h3>
                    <div class="stat"><span>Total Logs</span><b id="total">0</b></div>
                    <div class="stat"><span>Kafka</span><span class="badge">Active</span></div>
                    <div class="stat"><span>Worker</span><span class="badge">Running</span></div>
                </div>

            </div>

            <div class="card" style="margin-top:15px;">
                <h3>Recent Logs</h3>
                <div id="logs"></div>
            </div>

        </div>

        <!-- LOGS -->
        <div id="logsPage" style="display:none;">
            <div class="card">
                <h3>All Logs</h3>
                <div id="allLogs"></div>
            </div>
        </div>

        <!-- KAFKA -->
        <div id="kafkaPage" style="display:none;">
            <div class="card">
                <h3>Kafka Status</h3>
                <p>Confluent Cloud → ACTIVE</p>
            </div>
        </div>

        <!-- SETTINGS -->
        <div id="settingsPage" style="display:none;">
            <div class="card">
                <h3>Settings</h3>
                <p>Configuration panel coming soon ⚙</p>
            </div>
        </div>

    </div>

    <script>

        const API = window.location.origin;
        let chart;

        function switchTab(tab) {

            document.getElementById("dashboard").style.display = tab === "dashboard" ? "block" : "none";
            document.getElementById("logsPage").style.display = tab === "logs" ? "block" : "none";
            document.getElementById("kafkaPage").style.display = tab === "kafka" ? "block" : "none";
            document.getElementById("settingsPage").style.display = tab === "settings" ? "block" : "none";

            document.getElementById("title").innerText = tab.toUpperCase();

            loadLogs();
        }

        async function loadLogs() {

            try {
                const res = await fetch(`${API}/api/Logs`);

                const text = await res.text();

                let data = [];

                try {
                    data = JSON.parse(text);
                } catch {
                    data = [];
                }

                if (!Array.isArray(data)) data = [];

                document.getElementById("total").innerText = data.length;

                const html = data.length ? data.map(x => `
                <div class="log">
                    <b>${x.message || "No message"}</b><br>
                    <small>${x.eventId || "-"}</small>
                </div>
            `).join("") : "<p>No logs found</p>";

                document.getElementById("logs").innerHTML = html;
                document.getElementById("allLogs").innerHTML = html;

                drawChart(data);

            } catch (e) {
                console.log("API Error", e);
            }
        }

        function drawChart(data) {

            const ctx = document.getElementById("chart");

            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: "line",
                data: {
                    labels: data.map((_, i) => i + 1),
                    datasets: [{
                        data: data.map((_, i) => i + 1),
                        borderColor: "#38bdf8",
                        tension: 0.4
                    }]
                },
                options: {
                    plugins: { legend: { display: false } }
                }
            });
        }

        loadLogs();
        setInterval(loadLogs, 5000);

    </script>

</body>
</html>
