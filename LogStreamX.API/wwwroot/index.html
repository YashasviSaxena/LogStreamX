<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LogStreamX</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0b1220;
            color: #fff;
            display: flex;
        }

        .sidebar {
            width: 220px;
            background: #111827;
            height: 100vh;
            padding: 20px;
        }

        .main {
            flex: 1;
            padding: 20px;
        }

        .card {
            background: #1f2937;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .log {
            padding: 10px;
            background: #111827;
            margin: 8px 0;
            border-left: 3px solid #38bdf8;
        }

        .btn {
            padding: 10px;
            background: #38bdf8;
            border: none;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h3>LogStreamX</h3>
        <p>Dashboard</p>
        <p>Logs</p>
        <p>Kafka</p>
        <p>Settings</p>
    </div>

    <div class="main">

        <h2>Live Logs</h2>
        <button class="btn" onclick="loadLogs()">Refresh</button>

        <div class="card">
            Total Logs: <span id="total">0</span>
        </div>

        <div class="card" id="logs"></div>

        <canvas id="chart"></canvas>

    </div>

    <script>
        let chart;

        async function loadLogs() {
            try {
                const res = await fetch('/api/logs');

                if (!res.ok) {
                    console.error("API Error:", res.status);
                    return;
                }

                const text = await res.text();

                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    console.error("Invalid JSON:", text);
                    return;
                }

                document.getElementById("total").innerText = data.length;

                let html = "";
                let labels = [];
                let counts = [];

                data.forEach((x, i) => {
                    let t = new Date(x.createdAt).toLocaleTimeString();
                    labels.push(t);
                    counts.push(i + 1);

                    html += `
                <div class="log">
                    <b>${x.message}</b><br/>
                    <small>${x.eventId} | ${new Date(x.createdAt).toLocaleString()}</small>
                </div>`;
                });

                document.getElementById("logs").innerHTML = html;

                drawChart(labels, counts);

            } catch (err) {
                console.error("UI Error:", err);
            }
        }

        function drawChart(labels, data) {
            const ctx = document.getElementById('chart');

            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Logs',
                        data: data,
                        borderColor: '#38bdf8'
                    }]
                }
            });
        }

        loadLogs();
        setInterval(loadLogs, 5000);
    </script>

</body>
</html>
