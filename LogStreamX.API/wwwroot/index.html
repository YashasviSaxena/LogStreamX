<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LogStreamX Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Inter;
            background: #0b1220;
            color: white;
            display: flex;
        }

        .sidebar {
            width: 220px;
            background: #0f172a;
            height: 100vh;
            padding: 20px;
        }

        .main {
            flex: 1;
            padding: 20px;
        }

        .card {
            background: #111827;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .log {
            padding: 10px;
            background: #0f172a;
            border-left: 3px solid #38bdf8;
            margin-bottom: 10px;
        }

        .green {
            color: #22c55e;
        }

        .red {
            color: #ef4444;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>🚀 LogStreamX</h2>
    </div>

    <div class="main">

        <h2>📊 Dashboard</h2>

        <div class="card">
            <p>Total Logs: <b id="total">0</b></p>
            <p>Status: <b id="status">Loading...</b></p>
        </div>

        <div class="card">
            <canvas id="chart"></canvas>
        </div>

        <div class="card">
            <h3>Logs</h3>
            <div id="logs"></div>
        </div>

    </div>

    <script>

        const API = "https://logstreamx.onrender.com";

        let chart;

        async function loadLogs() {

            try {
                const res = await fetch(API + "/api/logs", {
                    cache: "no-store"
                });

                const data = await res.json();

                document.getElementById("status").innerText = "Healthy";
                document.getElementById("status").className = "green";

                document.getElementById("total").innerText = data.length;

                let html = [];
                let labels = [];
                let counts = [];

                data.forEach((x, i) => {
                    labels.push(new Date(x.createdAt).toLocaleTimeString());
                    counts.push(i + 1);

                    html.push(`
                    <div class="log">
                        <b>${x.message}</b><br>
                        <small>${x.eventId}</small>
                    </div>
                `);
                });

                document.getElementById("logs").innerHTML = html.join("");

                drawChart(labels, counts);

            } catch (err) {
                document.getElementById("status").innerText = "DOWN";
                document.getElementById("status").className = "red";
            }
        }

        function drawChart(labels, data) {

            const ctx = document.getElementById("chart");

            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        borderColor: '#38bdf8'
                    }]
                }
            });
        }

        loadLogs();
        setInterval(loadLogs, 5000);

    </script>

</body>
</html>
