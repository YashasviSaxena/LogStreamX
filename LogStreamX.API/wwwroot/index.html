<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LogStreamX Pro</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Inter;
            background: #0a0f1c;
            color: #e5e7eb;
            display: flex;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            background: #0f172a;
            padding: 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 20px;
        }

        .nav div {
            padding: 12px;
            margin: 8px 0;
            border-radius: 10px;
            cursor: pointer;
            color: #94a3b8;
        }

            .nav div:hover {
                background: #1e293b;
                color: white;
            }

        /* MAIN */
        .main {
            flex: 1;
            padding: 20px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            background: #38bdf8;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            color: black;
            font-weight: 600;
        }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .card {
            background: #111827;
            padding: 15px;
            border-radius: 15px;
        }

        /* LOGS */
        .log {
            padding: 12px;
            margin: 10px 0;
            background: #0f172a;
            border-left: 3px solid #38bdf8;
            border-radius: 10px;
        }

        .meta {
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #0f172a;
            margin: 8px 0;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <div class="logo">LogStreamX</div>
        <div class="nav">
            <div><i class="fa fa-chart-line"></i> Dashboard</div>
            <div><i class="fa fa-database"></i> Logs</div>
            <div><i class="fa fa-bolt"></i> Kafka</div>
            <div><i class="fa fa-cog"></i> Settings</div>
        </div>
    </div>

    <div class="main">

        <div class="top">
            <h2>Live Dashboard</h2>
            <button class="btn" onclick="loadLogs()">Refresh</button>
        </div>

        <div class="grid">

            <div class="card">
                <h3>Logs</h3>
                <div id="logs"></div>
            </div>

            <div>

                <div class="card">
                    <h3>Stats</h3>
                    <div class="stat"><span>Total</span><b id="total">0</b></div>
                    <div class="stat"><span>Kafka</span><b>Active</b></div>
                    <div class="stat"><span>Worker</span><b>Running</b></div>
                </div>

                <div class="card" style="margin-top:10px;">
                    <h3>Trend</h3>
                    <canvas id="chart"></canvas>
                </div>

            </div>

        </div>

    </div>

    <script>

        let chart;

        async function loadLogs() {
            try {
                const res = await fetch('/api/logs');

                if (!res.ok) throw new Error("API failed");

                const data = await res.json();

                document.getElementById("total").innerText = data.length;

                let html = "";
                let labels = [];
                let counts = [];

                data.forEach((x, i) => {
                    labels.push(i);
                    counts.push(i + 1);

                    html += `
                <div class="log">
                    <b>${x.message}</b>
                    <div class="meta">
                        <span>${x.eventId}</span>
                        <span>${new Date(x.createdAt).toLocaleString()}</span>
                    </div>
                </div>`;
                });

                document.getElementById("logs").innerHTML = html;

                drawChart(labels, counts);

            } catch (e) {
                console.error("UI Error:", e);
            }
        }

        function drawChart(labels, data) {
            const ctx = document.getElementById("chart");

            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: "line",
                data: {
                    labels,
                    datasets: [{
                        data,
                        borderColor: "#38bdf8"
                    }]
                }
            });
        }

        loadLogs();
        setInterval(loadLogs, 5000);

    </script>

</body>
</html>
