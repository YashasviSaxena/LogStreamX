<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LogStreamX</title>

    <link rel="icon" href="/favicon.ico">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter;
        }

        body {
            background: #0b1220;
            color: #e5e7eb;
            display: flex;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            background: #0f172a;
            height: 100vh;
            padding: 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 30px;
        }

        .nav div {
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 10px;
            cursor: pointer;
            color: #94a3b8;
        }

        .nav .active {
            background: #1e293b;
            color: white;
        }

        /* MAIN */
        .main {
            flex: 1;
            padding: 20px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
        }

        .btn {
            background: linear-gradient(135deg,#38bdf8,#2563eb);
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            color: white;
            cursor: pointer;
        }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
        }

        .card {
            background: #111827;
            padding: 15px;
            border-radius: 14px;
        }

        /* LOGS */
        .logs {
            max-height: 450px;
            overflow-y: auto;
        }

        .log {
            padding: 12px;
            margin-bottom: 10px;
            background: #0f172a;
            border-left: 3px solid #38bdf8;
            border-radius: 10px;
        }

        .meta {
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
        }

        /* STATS */
        .stat {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #0f172a;
            margin-bottom: 10px;
            border-radius: 10px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 8px;
            background: #1e293b;
            color: #38bdf8;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo">LogStreamX</div>

        <div class="nav">
            <div id="tab-dashboard" class="active" onclick="switchTab('dashboard')">📊 Dashboard</div>
            <div id="tab-logs" onclick="switchTab('logs')">📁 Logs</div>
            <div id="tab-kafka" onclick="switchTab('kafka')">⚡ Kafka</div>
            <div id="tab-settings" onclick="switchTab('settings')">⚙ Settings</div>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main">

        <div class="topbar">
            <div class="title" id="title">Dashboard</div>
            <button class="btn" onclick="loadLogs()">Refresh</button>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard">

            <div class="grid">

                <div class="card">
                    <h3>Log Trend</h3>
                    <canvas id="chart"></canvas>
                </div>

                <div class="card">
                    <h3>Stats</h3>

                    <div class="stat">
                        <span>Total Logs</span>
                        <b id="total">0</b>
                    </div>

                    <div class="stat">
                        <span>Kafka</span>
                        <span class="badge">Active</span>
                    </div>

                    <div class="stat">
                        <span>Worker</span>
                        <span class="badge">Running</span>
                    </div>

                </div>

            </div>

            <div class="card" style="margin-top:15px;">
                <h3>Recent Logs</h3>
                <div class="logs" id="recentLogs"></div>
            </div>

        </div>

        <!-- LOGS -->
        <div id="logsView" style="display:none;">
            <div class="card">
                <h3>All Logs</h3>
                <div class="logs" id="allLogs"></div>
            </div>
        </div>

        <!-- KAFKA -->
        <div id="kafkaView" style="display:none;">
            <div class="card">
                <h3>Kafka Status</h3>
                <div class="stat"><span>Broker</span><b>Confluent</b></div>
                <div class="stat"><span>Topic</span><b>logs-topic</b></div>
            </div>
        </div>

        <!-- SETTINGS -->
        <div id="settingsView" style="display:none;">
            <div class="card">
                <h3>Settings</h3>
                <div class="stat"><span>API</span><b id="api">/api/logs</b></div>
            </div>
        </div>

    </div>

    <script>

        const API = window.location.origin;

        let chart;

        // ---------------- TAB SWITCH ----------------
        function switchTab(tab) {

            ["dashboard", "logs", "kafka", "settings"].forEach(t => {
                document.getElementById(t + "View")?.style && (document.getElementById(t + "View").style.display = "none");
            });

            document.getElementById("dashboard").style.display = tab === "dashboard" ? "block" : "none";
            document.getElementById("logsView").style.display = tab === "logs" ? "block" : "none";
            document.getElementById("kafkaView").style.display = tab === "kafka" ? "block" : "none";
            document.getElementById("settingsView").style.display = tab === "settings" ? "block" : "none";

            document.querySelectorAll(".nav div").forEach(x => x.classList.remove("active"));
            document.getElementById("tab-" + tab).classList.add("active");

            document.getElementById("title").innerText = tab.toUpperCase();

            if (tab === "dashboard" || tab === "logs") {
                loadLogs();
            }
        }

        // ---------------- LOAD LOGS (FIXED) ----------------
        async function loadLogs() {

            try {
                const res = await fetch(`${API}/api/logs`);

                if (!res.ok) {
                    console.log("API error", res.status);
                    return;
                }

                const data = await res.json();

                if (!Array.isArray(data)) return;

                document.getElementById("total").innerText = data.length;

                // RECENT
                document.getElementById("recentLogs").innerHTML =
                    data.slice(0, 5).map(x => `
                    <div class="log">
                        <div>${x.message}</div>
                        <div class="meta">
                            <span>${x.eventId}</span>
                            <span>${new Date(x.createdAt).toLocaleString()}</span>
                        </div>
                    </div>
                `).join("");

                // ALL
                document.getElementById("allLogs").innerHTML =
                    data.map(x => `
                    <div class="log">
                        <div>${x.message}</div>
                        <div class="meta">
                            <span>${x.eventId}</span>
                            <span>${new Date(x.createdAt).toLocaleString()}</span>
                        </div>
                    </div>
                `).join("");

                // CHART
                drawChart(data);

            } catch (e) {
                console.log("UI error", e);
            }
        }

        // ---------------- CHART ----------------
        function drawChart(data) {

            const ctx = document.getElementById("chart");

            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: "line",
                data: {
                    labels: data.map(x => new Date(x.createdAt).toLocaleTimeString()),
                    datasets: [{
                        data: data.map((_, i) => i + 1),
                        borderColor: "#38bdf8",
                        tension: 0.4
                    }]
                },
                options: {
                    plugins: { legend: { display: false } },
                    scales: { x: { display: false } }
                }
            });
        }

        // INIT
        loadLogs();
        setInterval(loadLogs, 5000);

    </script>

</body>
</html>
