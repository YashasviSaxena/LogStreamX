<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LogStreamX</title>

    <link rel="icon" href="/favicon.ico">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter;
        }

        body {
            background: #0b1220;
            color: #e5e7eb;
            display: flex;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            height: 100vh;
            background: #0f172a;
            padding: 20px;
        }

        .logo {
            color: #38bdf8;
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .nav div {
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 10px;
            cursor: pointer;
            color: #94a3b8;
        }

            .nav div.active,
            .nav div:hover {
                background: #1e293b;
                color: white;
            }

        /* MAIN */
        .main {
            flex: 1;
            padding: 20px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .btn {
            background: #38bdf8;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            color: white;
        }

        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
        }

        .card {
            background: #111827;
            padding: 15px;
            border-radius: 14px;
        }

        .logs {
            max-height: 400px;
            overflow-y: auto;
        }

        .log {
            padding: 10px;
            margin-bottom: 10px;
            background: #0f172a;
            border-left: 3px solid #38bdf8;
            border-radius: 8px;
        }

        .meta {
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #0f172a;
            margin-bottom: 10px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo">LogStreamX</div>

        <div class="nav">
            <div class="active" onclick="switchTab('dashboard')">📊 Dashboard</div>
            <div onclick="switchTab('logs')">📁 Logs</div>
            <div onclick="switchTab('kafka')">⚡ Kafka</div>
            <div onclick="switchTab('settings')">⚙ Settings</div>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main">

        <div class="topbar">
            <h2 id="title">Dashboard</h2>
            <button class="btn" onclick="loadData()">Refresh</button>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard">

            <div class="grid">

                <div class="card">
                    <h3>Logs</h3>
                    <div class="logs" id="logList"></div>
                </div>

                <div class="card">
                    <h3>Stats</h3>

                    <div class="stat">
                        <span>Total Logs</span>
                        <b id="total">0</b>
                    </div>

                    <div class="stat">
                        <span>Kafka</span>
                        <b>Active</b>
                    </div>

                    <div class="stat">
                        <span>Worker</span>
                        <b>Running</b>
                    </div>
                </div>

            </div>

        </div>

        <!-- LOGS TAB -->
        <div id="logs" style="display:none;" class="card">
            <h3>All Logs</h3>
            <div id="allLogs"></div>
        </div>

        <!-- KAFKA -->
        <div id="kafka" style="display:none;" class="card">
            <h3>Kafka Status</h3>
            <p>Confluent Cloud Active</p>
        </div>

        <!-- SETTINGS -->
        <div id="settings" style="display:none;" class="card">
            <h3>Settings</h3>
            <p>Coming soon ⚙</p>
        </div>

    </div>

    <script>

        const API = window.location.origin;

        // ================= TAB SWITCH =================
        function switchTab(tab) {

            document.getElementById("dashboard").style.display = tab === "dashboard" ? "block" : "none";
            document.getElementById("logs").style.display = tab === "logs" ? "block" : "none";
            document.getElementById("kafka").style.display = tab === "kafka" ? "block" : "none";
            document.getElementById("settings").style.display = tab === "settings" ? "block" : "none";

            document.getElementById("title").innerText = tab.toUpperCase();

            loadData();
        }

        // ================= LOAD DATA SAFE =================
        async function loadData() {

            try {
                const res = await fetch(`${API}/api/Logs`);

                const data = await res.json();

                if (!Array.isArray(data)) {
                    document.getElementById("logList").innerHTML = "No logs found";
                    return;
                }

                document.getElementById("total").innerText = data.length;

                const html = data.map(x => `
                <div class="log">
                    <div>${x.message ?? "No message"}</div>
                    <div class="meta">
                        <span>${x.eventId ?? "-"}</span>
                        <span>${new Date(x.createdAt ?? Date.now()).toLocaleString()}</span>
                    </div>
                </div>
            `).join("");

                document.getElementById("logList").innerHTML = html;
                document.getElementById("allLogs").innerHTML = html;

            } catch (e) {
                console.log("API Error", e);
            }
        }

        loadData();
        setInterval(loadData, 5000);

    </script>

</body>
</html>
