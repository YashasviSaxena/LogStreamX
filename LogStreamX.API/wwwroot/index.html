<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LogStreamX</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Inter;
            background: #0b1220;
            color: #e5e7eb;
            display: flex;
        }

        .sidebar {
            width: 240px;
            background: #0f172a;
            height: 100vh;
            padding: 20px;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 25px;
        }

        .nav div {
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            color: #94a3b8;
            border-radius: 10px;
        }

            .nav div:hover,
            .nav .active {
                background: rgba(56,189,248,0.15);
                color: white;
            }

        .main {
            flex: 1;
            padding: 20px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .btn {
            background: linear-gradient(135deg,#38bdf8,#2563eb);
            border: none;
            padding: 10px 14px;
            color: white;
            border-radius: 10px;
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
        }

        .card {
            background: #111827;
            padding: 15px;
            border-radius: 14px;
        }

        .logs {
            max-height: 500px;
            overflow-y: auto;
        }

        .log {
            background: #0f172a;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 3px solid #38bdf8;
            border-radius: 8px;
        }

        .meta {
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #0f172a;
            border-radius: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo">LogStreamX</div>

        <div class="nav">
            <div class="active" onclick="showTab('dashboard')"><i class="fa fa-chart-line"></i> Dashboard</div>
            <div onclick="showTab('logs')"><i class="fa fa-database"></i> Logs</div>
            <div onclick="showTab('kafka')"><i class="fa fa-bolt"></i> Kafka</div>
            <div onclick="showTab('settings')"><i class="fa fa-cog"></i> Settings</div>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main">

        <div class="topbar">
            <h2>Live Log Dashboard</h2>
            <button class="btn" onclick="loadLogs()">Refresh</button>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboardTab">

            <div class="grid">

                <div class="card">
                    <h3>Live Logs</h3>
                    <div class="logs" id="logs"></div>
                    <p id="emptyState" style="color:#94a3b8; display:none;">No logs found</p>
                </div>

                <div>

                    <div class="card">
                        <h3>Stats</h3>

                        <div class="stat">
                            <span>Total Logs</span>
                            <b id="total">0</b>
                        </div>

                        <div class="stat">
                            <span>Kafka</span>
                            <b>Active</b>
                        </div>

                        <div class="stat">
                            <span>Worker</span>
                            <b>Running</b>
                        </div>
                    </div>

                    <div class="card" style="margin-top:15px;">
                        <h3>Trend</h3>
                        <canvas id="chart"></canvas>
                    </div>

                </div>
            </div>

        </div>

        <!-- LOGS TAB -->
        <div id="logsTab" style="display:none">
            <div class="card">
                <h3>All Logs</h3>
                <div id="logsFull"></div>
            </div>
        </div>

        <!-- KAFKA TAB -->
        <div id="kafkaTab" style="display:none">
            <div class="card">
                <h3>Kafka Status</h3>
                <p>✅ Connected</p>
            </div>
        </div>

        <!-- SETTINGS TAB -->
        <div id="settingsTab" style="display:none">
            <div class="card">
                <h3>Settings</h3>
                <p>No settings yet</p>
            </div>
        </div>

    </div>

    <script>

        const API_BASE =
            window.location.hostname === "localhost"
                ? "http://localhost:5191"
                : "https://YOUR-RENDER-URL.onrender.com";

        let chart;

        function showTab(tab) {

            document.querySelectorAll('[id$="Tab"]').forEach(t => t.style.display = "none");

            document.getElementById(tab + "Tab").style.display = "block";
        }

        async function loadLogs() {

            try {
                const res = await fetch(`${API_BASE}/api/logs`);

                if (!res.ok) throw new Error("API Error " + res.status);

                const data = await res.json();

                document.getElementById("total").innerText = data.length;

                let html = "";
                let labels = [];
                let counts = [];

                if (!data || data.length === 0) {
                    document.getElementById("emptyState").style.display = "block";
                    return;
                } else {
                    document.getElementById("emptyState").style.display = "none";
                }

                data.forEach((x, i) => {

                    let msg = x.message || "No message";
                    let time = x.createdAt ? new Date(x.createdAt) : new Date();

                    labels.push(time.toLocaleTimeString());
                    counts.push(i + 1);

                    html += `
                <div class="log">
                    <div><b>${msg}</b></div>
                    <div class="meta">
                        <span>${x.eventId || "-"}</span>
                        <span>${time.toLocaleString()}</span>
                    </div>
                </div>`;
                });

                document.getElementById("logs").innerHTML = html;
                document.getElementById("logsFull").innerHTML = html;

                drawChart(labels, counts);

            } catch (err) {
                console.error(err);
                document.getElementById("logs").innerHTML =
                    "<p style='color:red'>API not reachable</p>";
            }
        }

        function drawChart(labels, data) {

            const ctx = document.getElementById('chart');

            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Logs',
                        data: data,
                        borderColor: '#38bdf8'
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } }
                }
            });
        }

        loadLogs();
        setInterval(loadLogs, 5000);

    </script>

</body>
</html>
