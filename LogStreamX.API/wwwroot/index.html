<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LogStreamX</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Inter;
            background: #0b1220;
            color: #e5e7eb;
            display: flex;
        }

        .sidebar {
            width: 240px;
            background: #0f172a;
            height: 100vh;
            padding: 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #38bdf8;
        }

        .main {
            flex: 1;
            padding: 20px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .btn {
            background: #2563eb;
            border: none;
            padding: 10px 12px;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        .card {
            background: #111827;
            padding: 15px;
            border-radius: 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
        }

        .logs {
            max-height: 500px;
            overflow-y: auto;
        }

        .log {
            background: #0f172a;
            padding: 10px;
            margin-bottom: 10px;
            border-left: 3px solid #38bdf8;
            border-radius: 8px;
        }

        .meta {
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <div class="logo">LogStreamX</div>
    </div>

    <div class="main">

        <div class="topbar">
            <h2>Live Logs</h2>
            <button class="btn" onclick="loadLogs()">Refresh</button>
        </div>

        <div class="grid">

            <div class="card">
                <h3>Logs</h3>
                <div class="logs" id="logs"></div>
            </div>

            <div class="card">
                <h3>Stats</h3>
                <p>Total: <b id="total">0</b></p>
                <canvas id="chart"></canvas>
            </div>

        </div>

    </div>

    <script>

        const API_URL = "https://logstreamx.onrender.com/api/logs"; // IMPORTANT

        let chart;

        async function loadLogs() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();

                document.getElementById("total").innerText = data.length;

                let html = "";
                let labels = [];
                let counts = [];

                data.forEach((x, i) => {
                    labels.push(new Date(x.createdAt).toLocaleTimeString());
                    counts.push(i + 1);

                    html += `
                <div class="log">
                    <div><b>${x.message}</b></div>
                    <div class="meta">
                        <span>${x.eventId}</span>
                        <span>${new Date(x.createdAt).toLocaleString()}</span>
                    </div>
                </div>`;
                });

                document.getElementById("logs").innerHTML = html;

                drawChart(labels, counts);

            } catch (err) {
                console.error("API Error:", err);
            }
        }

        function drawChart(labels, data) {
            const ctx = document.getElementById("chart");

            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: "line",
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        borderColor: "#38bdf8",
                        tension: 0.4
                    }]
                },
                options: {
                    plugins: { legend: { display: false } },
                    scales: { x: { display: false } }
                }
            });
        }

        loadLogs();
        setInterval(loadLogs, 5000);

    </script>

</body>
</html>
