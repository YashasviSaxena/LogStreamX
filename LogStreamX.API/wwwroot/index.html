<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LogStreamX Observability</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Inter;
            background: #0b1220;
            color: #e5e7eb;
            display: flex;
        }

        .sidebar {
            width: 230px;
            background: #0f172a;
            height: 100vh;
            padding: 20px;
        }

        .logo {
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 20px;
        }

        .nav div {
            padding: 10px;
            margin: 6px 0;
            cursor: pointer;
            border-radius: 8px;
        }

            .nav div:hover {
                background: #1e293b;
            }

        .main {
            flex: 1;
            padding: 20px;
        }

        .card {
            background: #111827;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .log {
            background: #0f172a;
            padding: 10px;
            margin-bottom: 10px;
            border-left: 3px solid #38bdf8;
            border-radius: 6px;
        }

        .meta {
            font-size: 12px;
            color: #94a3b8;
        }

        .green {
            color: #22c55e;
        }

        .red {
            color: #ef4444;
        }

        .yellow {
            color: #facc15;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <div class="logo">🚀 LogStreamX</div>

        <div class="nav">
            <div onclick="show('dashboard')">📊 Dashboard</div>
            <div onclick="show('logs')">📄 Logs</div>
            <div onclick="show('kafka')">⚡ Kafka</div>
            <div onclick="show('settings')">⚙️ Settings</div>
        </div>
    </div>

    <div class="main">

        <!-- DASHBOARD -->
        <div id="dashboard">
            <h2>📊 Dashboard</h2>

            <div class="card">
                <p>Total Logs: <b id="total">0</b></p>
                <p>Status: <b id="status" class="yellow">Checking...</b></p>
            </div>

            <div class="card">
                <canvas id="chart"></canvas>
            </div>
        </div>

        <!-- LOGS -->
        <div id="logs" style="display:none;">
            <h2>📄 Logs</h2>
            <div id="logBox"></div>
        </div>

        <!-- KAFKA -->
        <div id="kafka" style="display:none;">
            <h2>⚡ Kafka</h2>
            <div class="card">
                <p>Pipeline: API → Kafka → Worker → DB</p>
                <p>Status: <b class="green">Active</b></p>
            </div>
        </div>

        <!-- SETTINGS -->
        <div id="settings" style="display:none;">
            <h2>⚙️ Settings</h2>

            <div class="card">
                <p>API: https://logstreamx.onrender.com/api/Logs</p>
                <p>Swagger: /swagger</p>
            </div>
        </div>

    </div>

    <script>

        const API = "https://logstreamx.onrender.com/api/Logs";

        let chart;

        function show(tab) {
            document.getElementById("dashboard").style.display = "none";
            document.getElementById("logs").style.display = "none";
            document.getElementById("kafka").style.display = "none";
            document.getElementById("settings").style.display = "none";

            document.getElementById(tab).style.display = "block";
        }

        async function loadLogs() {
            try {
                const res = await fetch(API, { cache: "no-store" });

                if (!res.ok) throw new Error("API failed");

                const data = await res.json();

                document.getElementById("status").innerText = "Healthy";
                document.getElementById("status").className = "green";

                document.getElementById("total").innerText = data.length;

                let html = "";
                let labels = [];
                let values = [];

                if (!data.length) {
                    html = "<p style='color:#facc15'>No logs found</p>";
                }

                data.forEach((x, i) => {

                    labels.push(new Date(x.createdAt).toLocaleTimeString());
                    values.push(i + 1);

                    html += `
                    <div class="log">
                        <b>${x.message}</b>
                        <div class="meta">
                            ${x.eventId} | ${new Date(x.createdAt).toLocaleString()}
                        </div>
                    </div>
                `;
                });

                document.getElementById("logBox").innerHTML = html;

                drawChart(labels, values);

            } catch (err) {
                console.log(err);
                document.getElementById("status").innerText = "DOWN";
                document.getElementById("status").className = "red";
            }
        }

        function drawChart(labels, data) {
            const ctx = document.getElementById("chart");

            if (!ctx) return;

            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: "line",
                data: {
                    labels,
                    datasets: [{
                        data,
                        borderColor: "#38bdf8",
                        fill: false
                    }]
                }
            });
        }

        loadLogs();
        setInterval(loadLogs, 5000);

    </script>

</body>
</html>
