<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>LogStreamX Observability</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0b1220;
            color: white;
            display: flex;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            background: #0f172a;
            height: 100vh;
            padding: 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
        }

        .menu div {
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            cursor: pointer;
        }

            .menu div:hover {
                background: #1e293b;
            }

        /* MAIN */
        .main {
            flex: 1;
            padding: 20px;
        }

        /* TOP */
        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            background: #38bdf8;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .card {
            background: #111827;
            padding: 15px;
            border-radius: 12px;
        }

        /* LOGS */
        .log {
            background: #0f172a;
            padding: 10px;
            margin-bottom: 10px;
            border-left: 3px solid #38bdf8;
            border-radius: 8px;
        }

        .meta {
            font-size: 12px;
            color: #94a3b8;
        }
    </style>

</head>

<body>

    <div class="sidebar">
        <div class="logo">LogStreamX</div>
        <div class="menu">
            <div><i class="fa fa-chart-line"></i> Dashboard</div>
            <div><i class="fa fa-database"></i> Logs</div>
            <div><i class="fa fa-bolt"></i> Kafka</div>
            <div><i class="fa fa-cog"></i> Settings</div>
        </div>
    </div>

    <div class="main">

        <div class="top">
            <h2>Observability Dashboard</h2>
            <button class="btn" onclick="loadLogs()">Refresh</button>
        </div>

        <div class="grid">

            <!-- LOGS -->
            <div class="card">
                <h3>Live Logs</h3>
                <div id="logs"></div>
            </div>

            <!-- STATS -->
            <div>

                <div class="card">
                    <h3>System Status</h3>
                    <p>Kafka: <b>Active</b></p>
                    <p>Worker: <b>Running</b></p>
                    <p>Total Logs: <b id="count">0</b></p>
                </div>

                <div class="card">
                    <h3>Traffic</h3>
                    <canvas id="chart"></canvas>
                </div>

            </div>

        </div>
    </div>

    <script>

        let chart;

        async function loadLogs() {

            try {

                const res = await fetch('/api/Logs');

                if (!res.ok) return;

                const data = await res.json();

                document.getElementById("count").innerText = data.length;

                let html = [];
                let labels = [];
                let values = [];

                data.forEach((x, i) => {

                    labels.push(i);
                    values.push(i + 1);

                    html.push(`
<div class="log">
<b>${x.message}</b>
<div class="meta">${x.eventId} | ${x.source}</div>
</div>
`);

                });

                document.getElementById("logs").innerHTML = html.join("");

                drawChart(labels, values);

            } catch (e) {
                console.log("API error", e);
            }

        }

        function drawChart(labels, data) {

            if (chart) chart.destroy();

            chart = new Chart(document.getElementById("chart"), {
                type: "line",
                data: {
                    labels: labels,
                    datasets: [{
                        label: "logs",
                        data: data,
                        borderColor: "#38bdf8"
                    }]
                }
            });

        }

        loadLogs();
        setInterval(loadLogs, 5000);

    </script>

</body>
</html>
