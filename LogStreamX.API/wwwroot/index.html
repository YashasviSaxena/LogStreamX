<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LogStreamX</title>

    <link rel="icon" href="/favicon.ico">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter;
        }

        body {
            background: #0b1220;
            color: #e5e7eb;
            display: flex;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            background: #0f172a;
            height: 100vh;
            padding: 20px;
        }

        .logo {
            color: #38bdf8;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .nav div {
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 10px;
            cursor: pointer;
            color: #94a3b8;
        }

            .nav div:hover {
                background: #1e293b;
                color: #fff;
            }

        /* MAIN */
        .main {
            flex: 1;
            padding: 20px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
        }

        .btn {
            background: #38bdf8;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            color: white;
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
        }

        .card {
            background: #111827;
            padding: 15px;
            border-radius: 14px;
        }

        .logs {
            margin-top: 10px;
            max-height: 500px;
            overflow: auto;
        }

        .log {
            padding: 12px;
            margin-bottom: 10px;
            background: #0f172a;
            border-left: 3px solid #38bdf8;
            border-radius: 10px;
        }

        .meta {
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 10px;
            background: #0f172a;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo">LogStreamX</div>

        <div class="nav">
            <div onclick="showTab('dashboard')"><i class="fa fa-chart-line"></i> Dashboard</div>
            <div onclick="showTab('logs')"><i class="fa fa-database"></i> Logs</div>
            <div onclick="showTab('kafka')"><i class="fa fa-bolt"></i> Kafka</div>
            <div onclick="showTab('settings')"><i class="fa fa-cog"></i> Settings</div>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main">

        <div class="topbar">
            <div class="title">Live Log Dashboard</div>
            <button class="btn" onclick="loadLogs()">Refresh</button>
        </div>

        <div class="grid">

            <div class="card">
                <h3>Live Logs</h3>
                <div class="logs" id="logs"></div>
            </div>

            <div>

                <div class="card">
                    <h3>Stats</h3>

                    <div class="stat">
                        <span>Total Logs</span>
                        <b id="total">0</b>
                    </div>

                    <div class="stat">
                        <span>Kafka</span>
                        <b>Active</b>
                    </div>

                    <div class="stat">
                        <span>Worker</span>
                        <b>Running</b>
                    </div>
                </div>

                <div class="card" style="margin-top:15px;">
                    <h3>Log Trend</h3>
                    <canvas id="chart"></canvas>
                </div>

            </div>
        </div>

    </div>

    <script>

        const API = window.location.origin;
        let chart;

        // ================= TAB =================
        function showTab(tab) {
            const logs = document.getElementById("logs");

            if (tab === "dashboard" || tab === "logs") {
                loadLogs();
            }

            if (tab === "kafka") {
                logs.innerHTML = "<div style='color:#38bdf8'>Kafka Connected (Confluent)</div>";
            }

            if (tab === "settings") {
                logs.innerHTML = "<div style='color:#94a3b8'>Settings coming soon...</div>";
            }
        }

        // ================= SAFE API LOAD =================
        async function loadLogs() {
            try {
                const res = await fetch(`${API}/api/logs`);
                const data = await res.json();

                // ✅ FIX: force array safety
                const logsArray = Array.isArray(data) ? data : [];

                document.getElementById("total").innerText = logsArray.length;

                let html = "";
                let labels = [];
                let counts = [];

                logsArray.forEach((x, i) => {

                    labels.push(new Date(x.createdAt || Date.now()).toLocaleTimeString());
                    counts.push(i + 1);

                    html += `
                <div class="log">
                    <div>${x.message || "No message"}</div>
                    <div class="meta">
                        <span>${x.eventId || "-"}</span>
                        <span>${new Date(x.createdAt || Date.now()).toLocaleString()}</span>
                    </div>
                </div>`;
                });

                document.getElementById("logs").innerHTML =
                    html || "<div style='color:#94a3b8'>No logs found</div>";

                drawChart(labels, counts);

            } catch (err) {
                document.getElementById("logs").innerHTML =
                    "<div style='color:red'>API Error: " + err.message + "</div>";
            }
        }

        // ================= CHART =================
        function drawChart(labels, data) {
            const ctx = document.getElementById("chart");

            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: "line",
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        borderColor: "#38bdf8",
                        tension: 0.4
                    }]
                },
                options: {
                    plugins: { legend: { display: false } },
                    scales: { x: { display: false } }
                }
            });
        }

        // INIT
        loadLogs();
        setInterval(loadLogs, 5000);

    </script>

</body>
</html>
