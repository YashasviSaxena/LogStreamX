<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LogStreamX</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0b1220;
            color: white;
            display: flex;
        }

        .sidebar {
            width: 220px;
            background: #0f172a;
            height: 100vh;
            padding: 20px;
        }

            .sidebar div {
                padding: 10px;
                margin: 8px 0;
                cursor: pointer;
            }

        .main {
            flex: 1;
            padding: 20px;
        }

        .card {
            background: #111827;
            padding: 15px;
            border-radius: 10px;
        }

        .log {
            padding: 10px;
            background: #0f172a;
            margin: 10px 0;
            border-left: 3px solid #38bdf8;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>LogStreamX</h2>
        <div onclick="showTab('dashboard')">Dashboard</div>
        <div onclick="showTab('logs')">Logs</div>
        <div onclick="showTab('kafka')">Kafka</div>
        <div onclick="showTab('settings')">Settings</div>
    </div>

    <div class="main">

        <div id="dashboard" class="tab">
            <div class="card">
                <h3>Total Logs: <span id="total">0</span></h3>
            </div>
        </div>

        <div id="logs" class="tab">
            <div class="card">
                <h3>Live Logs</h3>
                <div id="logList"></div>
            </div>
        </div>

        <div id="kafka" class="tab" style="display:none;">
            <div class="card">
                <h3>Kafka Status</h3>
                <p>✅ Connected</p>
            </div>
        </div>

        <div id="settings" class="tab" style="display:none;">
            <div class="card">
                <h3>Settings</h3>
                <p>No settings yet</p>
            </div>
        </div>

    </div>

    <script>

        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.style.display = 'none');
            document.getElementById(tab).style.display = 'block';
        }

        // SAFE FETCH (FIXED FOR RENDER)
        async function loadLogs() {
            try {
                const res = await fetch('/api/logs');

                if (!res.ok) {
                    console.error("API Error:", res.status);
                    return;
                }

                const data = await res.json();

                document.getElementById("total").innerText = data.length;

                let html = "";

                data.forEach(x => {
                    html += `
                <div class="log">
                    <b>${x.message}</b><br/>
                    <small>${x.eventId} | ${new Date(x.createdAt).toLocaleString()}</small>
                </div>`;
                });

                document.getElementById("logList").innerHTML = html;

            } catch (err) {
                console.error("UI Error:", err);
            }
        }

        loadLogs();
        setInterval(loadLogs, 5000);

    </script>

</body>
</html>
