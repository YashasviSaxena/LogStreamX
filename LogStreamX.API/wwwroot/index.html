<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LogStreamX</title>

    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter;
        }

        body {
            background: #0b1220;
            color: #e5e7eb;
            display: flex;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            height: 100vh;
            background: #0f172a;
            padding: 20px;
        }

        .logo {
            color: #38bdf8;
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 25px;
        }

        .nav div {
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 10px;
            cursor: pointer;
            color: #94a3b8;
        }

            .nav div:hover {
                background: #1e293b;
                color: white;
            }

        /* MAIN */
        .main {
            flex: 1;
            padding: 20px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
        }

        .btn {
            background: #38bdf8;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            color: white;
            cursor: pointer;
        }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
        }

        .card {
            background: #111827;
            padding: 15px;
            border-radius: 14px;
        }

        /* LOGS */
        .logs {
            margin-top: 10px;
            max-height: 450px;
            overflow: auto;
        }

        .log {
            padding: 12px;
            margin-bottom: 10px;
            background: #0f172a;
            border-left: 3px solid #38bdf8;
            border-radius: 10px;
        }

        /* EMPTY STATE */
        .empty {
            color: #64748b;
            text-align: center;
            padding: 30px;
        }

        /* STATS */
        .stat {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #0f172a;
            margin-bottom: 10px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo">LogStreamX</div>

        <div class="nav">
            <div onclick="showTab('dashboard')">📊 Dashboard</div>
            <div onclick="showTab('logs')">📁 Logs</div>
            <div onclick="showTab('kafka')">⚡ Kafka</div>
            <div onclick="showTab('settings')">⚙ Settings</div>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main">

        <div class="topbar">
            <div class="title">Live Log Dashboard</div>
            <button class="btn" onclick="loadLogs()">Refresh</button>
        </div>

        <div class="grid">

            <!-- LOGS -->
            <div class="card">
                <h3>Live Logs</h3>
                <div class="logs" id="logs"></div>
            </div>

            <!-- RIGHT PANEL -->
            <div>

                <div class="card">
                    <h3>Stats</h3>

                    <div class="stat">
                        <span>Total Logs</span>
                        <b id="total">0</b>
                    </div>

                    <div class="stat">
                        <span>Kafka</span>
                        <b>Active</b>
                    </div>

                    <div class="stat">
                        <span>Worker</span>
                        <b>Running</b>
                    </div>
                </div>

                <div class="card" style="margin-top:15px;">
                    <h3>Log Trend</h3>
                    <canvas id="chart"></canvas>
                </div>

            </div>

        </div>

    </div>

    <script>

        const API = window.location.origin;

        let chart = null;

        // ================= TAB =================
        function showTab(tab) {

            const logs = document.getElementById("logs");

            if (tab === "dashboard" || tab === "logs") {
                loadLogs();
            }

            if (tab === "kafka") {
                logs.innerHTML = "<div class='empty'>Kafka Connected 🚀</div>";
            }

            if (tab === "settings") {
                logs.innerHTML = "<div class='empty'>Settings Coming Soon ⚙</div>";
            }
        }

        // ================= LOAD LOGS =================
        async function loadLogs() {

            try {

                const res = await fetch(`${API}/api/logs`);
                const data = await res.json();

                // SAFE ARRAY CHECK
                const logs = Array.isArray(data) ? data : [];

                document.getElementById("total").innerText = logs.length;

                let html = "";
                let labels = [];
                let values = [];

                if (logs.length === 0) {
                    html = "<div class='empty'>No logs found yet</div>";
                }

                logs.forEach((x, i) => {

                    labels.push(new Date(x.createdAt || Date.now()).toLocaleTimeString());
                    values.push(i + 1);

                    html += `
<div class="log">
<div>${x.message || "No message"}</div>
<div style="font-size:12px;color:#94a3b8;display:flex;justify-content:space-between;">
<span>${x.eventId || "-"}</span>
<span>${new Date(x.createdAt || Date.now()).toLocaleString()}</span>
</div>
</div>
`;

                });

                document.getElementById("logs").innerHTML = html;

                drawChart(labels, values);

            } catch (err) {

                document.getElementById("logs").innerHTML =
                    "<div class='empty' style='color:red'>API Error: " + err.message + "</div>";

            }

        }

        // ================= CHART FIX =================
        function drawChart(labels, data) {

            const ctx = document.getElementById("chart");

            // destroy old chart properly
            if (chart) {
                chart.destroy();
                chart = null;
            }

            chart = new Chart(ctx, {
                type: "line",
                data: {
                    labels: labels.length ? labels : ["No Data"],
                    datasets: [{
                        label: "Logs",
                        data: data.length ? data : [0],
                        borderColor: "#38bdf8",
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: { display: false }
                    }
                }
            });

        }

        // INIT
        loadLogs();
        setInterval(loadLogs, 5000);

    </script>

</body>
</html>
