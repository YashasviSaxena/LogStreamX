<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LogStreamX</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="icon" href="/favicon.ico">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0b1220;
            color: white;
            display: flex;
        }

        /* SIDEBAR */
        .sidebar {
            width: 220px;
            height: 100vh;
            background: #111827;
            padding: 20px;
        }

            .sidebar h2 {
                color: #38bdf8;
            }

        .menu {
            margin-top: 20px;
        }

            .menu div {
                padding: 10px;
                margin: 5px 0;
                cursor: pointer;
                border-radius: 6px;
            }

                .menu div:hover {
                    background: #1f2937;
                }

        /* MAIN */
        .main {
            flex: 1;
            padding: 20px;
        }

        .card {
            background: #1f2937;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        button {
            padding: 8px 12px;
            border: none;
            background: #38bdf8;
            color: white;
            cursor: pointer;
            border-radius: 6px;
        }

        .log {
            padding: 10px;
            border-left: 3px solid #38bdf8;
            margin-bottom: 8px;
            background: #111827;
        }

        .badge {
            padding: 4px 8px;
            background: #0ea5e9;
            border-radius: 6px;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2>LogStreamX</h2>

        <div class="menu">
            <div onclick="showDashboard()">📊 Dashboard</div>
            <div onclick="showLogs()">📁 Logs</div>
            <div onclick="showKafka()">⚡ Kafka</div>
            <div onclick="showSettings()">⚙ Settings</div>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main">

        <h2 id="title">Dashboard</h2>

        <button onclick="fetchLogs()">Refresh</button>

        <!-- DASHBOARD -->
        <div id="dashboard">

            <div class="card">
                <h3>Stats</h3>
                <p>Total Logs: <span id="count">0</span></p>
                <p>Kafka: <span class="badge">Active</span></p>
                <p>Worker: <span class="badge">Running</span></p>
            </div>

            <div class="card">
                <h3>Log Trend</h3>
                <canvas id="chart"></canvas>
            </div>

        </div>

        <!-- LOGS -->
        <div id="logs" style="display:none;">
            <div class="card">
                <h3>All Logs</h3>
                <div id="logList">No logs yet</div>
            </div>
        </div>

        <!-- KAFKA -->
        <div id="kafka" style="display:none;">
            <div class="card">
                <h3>Kafka Status</h3>
                <p>Confluent Cloud: <span class="badge">Connected</span></p>
                <p>Topic: logs-topic</p>
            </div>
        </div>

        <!-- SETTINGS -->
        <div id="settings" style="display:none;">
            <div class="card">
                <h3>Settings</h3>
                <p>Environment: Production</p>
                <p>API: /api/LogPush</p>
            </div>
        </div>

    </div>

    <script>

        let chart;

        // ================= NAV =================
        function showDashboard() {
            document.getElementById("title").innerText = "Dashboard";
            document.getElementById("dashboard").style.display = "block";
            document.getElementById("logs").style.display = "none";
            document.getElementById("kafka").style.display = "none";
            document.getElementById("settings").style.display = "none";
        }

        function showLogs() {
            document.getElementById("title").innerText = "Logs";
            document.getElementById("dashboard").style.display = "none";
            document.getElementById("logs").style.display = "block";
            document.getElementById("kafka").style.display = "none";
            document.getElementById("settings").style.display = "none";
            fetchLogs();
        }

        function showKafka() {
            document.getElementById("title").innerText = "Kafka";
            document.getElementById("dashboard").style.display = "none";
            document.getElementById("logs").style.display = "none";
            document.getElementById("kafka").style.display = "block";
            document.getElementById("settings").style.display = "none";
        }

        function showSettings() {
            document.getElementById("title").innerText = "Settings";
            document.getElementById("dashboard").style.display = "none";
            document.getElementById("logs").style.display = "none";
            document.getElementById("kafka").style.display = "none";
            document.getElementById("settings").style.display = "block";
        }

        // ================= FETCH LOGS (SAFE) =================
        async function fetchLogs() {

            try {

                const res = await fetch("/api/LogPush"); // safe fallback endpoint

                let data = [];

                try {
                    data = await res.json();
                } catch {
                    data = [];
                }

                if (!Array.isArray(data)) data = [];

                document.getElementById("count").innerText = data.length;

                // LOG LIST
                document.getElementById("logList").innerHTML =
                    data.length === 0
                        ? "No logs found"
                        : data.map(x => `
                    <div class="log">
                        <b>${x.message || "No message"}</b><br>
                        <small>${x.eventId || "-"}</small>
                    </div>
                `).join("");

                drawChart(data);

            } catch (e) {
                console.log("UI error", e);
            }
        }

        // ================= CHART =================
        function drawChart(data) {

            const ctx = document.getElementById("chart");

            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: "line",
                data: {
                    labels: data.length ? data.map((_, i) => i + 1) : ["0"],
                    datasets: [{
                        data: data.length ? data.map((_, i) => i + 1) : [0],
                        borderColor: "#38bdf8",
                        tension: 0.4
                    }]
                },
                options: {
                    plugins: { legend: { display: false } }
                }
            });

        }

        // INIT
        fetchLogs();

    </script>

</body>
</html>
